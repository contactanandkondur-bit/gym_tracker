<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gym Log</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <script src="auth.js"></script>
  <header>
    <h1>🏋️ Gym Log</h1>
    <nav>
      <a href="index.html" class="active">Log</a>
      <a href="trends.html">Trends</a>
      <a href="health.html">Health</a>
      <button id="backup-btn" title="Download backup">⬇</button>
    </nav>
  </header>

  <main>
    <div class="sub-badges">
      <span id="weight-badge"></span>
      <span id="streak-badge"></span>
    </div>
    <div class="date-nav">
      <button id="prev-day" aria-label="Previous day">◀</button>
      <div class="date-nav-center">
        <div id="date-label"></div>
        <button id="today-btn" style="display:none">Jump to today</button>
      </div>
      <button id="next-day" aria-label="Next day">▶</button>
    </div>
    <div class="day-title" id="day-title"></div>
    <div id="exercise-list"></div>
    <label class="note-label" for="day-note" id="note-label" style="display:none">Notes (optional)</label>
    <textarea id="day-note" placeholder="How did it feel today?" style="display:none"></textarea>
    <div class="save-bar" id="save-bar" style="display:none">
      <button class="save-btn" id="save-btn">Save Workout</button>
      <div class="status" id="status"></div>
    </div>
  </main>

  <script src="workouts.js"></script>
  <script src="github.js"></script>
  <script src="backup.js"></script>
  <script src="app.js"></script>
</body>
</html>
